[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mmsim"
version = "0.1.0"
description = "Limit order book and market-making simulator"
requires-python = ">=3.11"
dependencies = ["numpy"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["mmsim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
